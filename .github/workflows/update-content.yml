name: Update article index

on:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-content.yml'
  schedule:
    # 00:17 UTC = 08:17 Singapore time. GitHub may delay scheduled workflows.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync upstream AI blog resource index
        run: python scripts/sync_source_index.py
      - name: Collect new public posts
        run: python scripts/update_content.py
      - name: Commit updated JSON index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/articles.json data/collector_status.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "chore: update article index"
            git push
          fi
